<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4fb0ee" />
    <title>Beasthaven</title>
    <meta name="description" content="Hatch, breed and battle lovable monsters and grow your own floating island haven." />
    <link rel="stylesheet" href="./src/loader.css" />
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="ui"></div>
    <div id="loader">
      <svg class="cloud c1" viewBox="0 0 200 80"><path d="M20 70c-12 0-18-9-15-18 3-10 14-12 22-8 1-15 15-24 29-19 7-14 30-18 42-4 12-7 31 0 32 16 13-2 26 8 24 21 10 1 16 8 12 12z" fill="#fff"/></svg>
      <svg class="cloud c2" viewBox="0 0 200 80"><path d="M20 70c-12 0-18-9-15-18 3-10 14-12 22-8 1-15 15-24 29-19 7-14 30-18 42-4 12-7 31 0 32 16 13-2 26 8 24 21 10 1 16 8 12 12z" fill="#fff"/></svg>
      <svg class="isle" viewBox="0 0 240 190">
        <path d="M24 92c0-10 40-22 96-22s96 12 96 22c0 6-8 10-20 14l-18 30-22 10-14 26-22-4-12 14-10-16-22 4-14-24-24-10-16-30c-11-4-18-8-18-14z" fill="#b07a52" stroke="#2a1a2f" stroke-width="6" stroke-linejoin="round"/>
        <path d="M50 118l14 24 24 10M120 118v40M190 118l-12 24-26 10" fill="none" stroke="#8a5a3a" stroke-width="5" stroke-linecap="round"/>
        <path d="M24 92c0-10 40-24 96-24s96 14 96 24c0 9-40 18-96 18S24 101 24 92z" fill="#7ec24f" stroke="#2a1a2f" stroke-width="6" stroke-linejoin="round"/>
        <path d="M40 90c20 6 60 9 80 9s60-3 80-9" fill="none" stroke="#97d35d" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="120" cy="58" rx="22" ry="28" fill="#fff6e3" stroke="#2a1a2f" stroke-width="6"/>
        <path d="M103 60c6-5 11 5 17 0s11-5 17 0" fill="none" stroke="#ff8a2a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="112" cy="46" r="4" fill="#ffc83d"/><circle cx="128" cy="40" r="3" fill="#62c63c"/><circle cx="126" cy="72" r="3.5" fill="#3fa9f5"/>
        <path d="M58 86c-2-14 4-24 14-24s14 12 10 24" fill="#5db33f" stroke="#2a1a2f" stroke-width="5"/>
        <path d="M168 86c0-10 6-18 14-18s12 8 10 18" fill="#4a9e36" stroke="#2a1a2f" stroke-width="5"/>
      </svg>
      <div class="logo">BEAST<span>HAVEN</span></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="label">Loading</div>
      <div class="tip"></div>
    </div>
    <script>
      // Keep the bar moving honestly while the game bundle downloads.
      (function () {
        var tips = [
          'Tip: two monsters of different elements can breed a brand-new hybrid!',
          'Tip: elements matter in battle — look for the green STRONG tag.',
          'Tip: monsters living in habitats earn gold even while you are away.',
          'Tip: feed your monsters to level them up and watch them evolve.',
          'Tip: rarer eggs take longer to hatch — and hatch in style.',
        ];
        var t = document.querySelector('#loader .tip');
        if (t) t.textContent = tips[Math.floor(Math.random() * tips.length)];
        var f = document.querySelector('#loader .fill');
        window.__loadK = 0.02;
        window.__preload = setInterval(function () {
          window.__loadK = Math.min(0.2, window.__loadK + (0.2 - window.__loadK) * 0.05);
          if (f) f.style.width = (window.__loadK * 100).toFixed(1) + '%';
        }, 60);
      })();
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
